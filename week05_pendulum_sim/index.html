<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>双摆模拟器 - Week05 混沌动力学实验</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1a24; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  canvas { display: block; flex: 1; min-height: 0; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  #panel {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 10px 16px; background: #20202e; border-top: 1px solid #34344a;
    font: 13px monospace; color: #c6cde8;
  }
  #panel label { display: flex; align-items: center; gap: 6px; }
  #panel input[type=range] { accent-color: #4f83e0; width: 130px; }
  #panel .val { min-width: 52px; text-align: right; color: #9ecbff; }
  #panel .hint { color: #6a7395; margin-left: auto; }
  #resetBtn {
    background: #2f6fd0; color: #eef3ff; border: 0; border-radius: 4px;
    padding: 6px 14px; font: 13px monospace; cursor: pointer;
  }
  #resetBtn:hover { background: #3d7fe0; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel">
  <label>摆长1 <input type="range" id="l1Slider" min="80" max="200" step="1" value="140"><span class="val" id="l1Val">140 px</span></label>
  <label>摆长2 <input type="range" id="l2Slider" min="80" max="200" step="1" value="140"><span class="val" id="l2Val">140 px</span></label>
  <label>重力 <input type="range" id="gSlider" min="1" max="25" step="0.1" value="9.8"><span class="val" id="gVal">9.8</span></label>
  <button id="resetBtn">重置双摆</button>
  <span class="hint">拖拽摆球设置初始角度，松手释放</span>
</div>
<script>
'use strict';

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

const PX_PER_M = 100;
const M1 = 1, M2 = 1;
const BOB_R = 14;
const INIT_T1 = Math.PI / 2;
const INIT_T2 = Math.PI / 2;

let L1_PX = 140;               // 上摆长 px（滑块 80~200）
let L2_PX = 140;               // 下摆长 px
let G = 9.8;                   // 重力加速度 m/s^2

let th1 = INIT_T1, w1 = 0;     // 上摆角（相对竖直）与角速度
let th2 = INIT_T2, w2 = 0;     // 下摆角与角速度
let dragging = 0;              // 0=无 1=拖上球 2=拖下球
let pivotX = 0, pivotY = 0;

const trail = [];              // {x, y, hue}
const TRAIL_MAX = 160;
let hueCursor = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  pivotX = w / 2;
  pivotY = h * 0.32;
}
window.addEventListener('resize', resize);
resize();

// ===== 双摆拉格朗日运动方程（RK4 用导数函数）=====
// 状态 s = [th1, w1, th2, w2]，返回 ds/dt
function derivs(s) {
  const L1 = L1_PX / PX_PER_M, L2 = L2_PX / PX_PER_M;
  const [t1, o1, t2, o2] = s;
  const d = t1 - t2;
  const den = 2 * M1 + M2 - M2 * Math.cos(2 * d);
  const a1 = (-G * (2 * M1 + M2) * Math.sin(t1)
              - M2 * G * Math.sin(t1 - 2 * t2)
              - 2 * Math.sin(d) * M2 * (o2 * o2 * L2 + o1 * o1 * L1 * Math.cos(d)))
             / (L1 * den);
  const a2 = (2 * Math.sin(d) * (o1 * o1 * L1 * (M1 + M2)
              + G * (M1 + M2) * Math.cos(t1)
              + o2 * o2 * L2 * M2 * Math.cos(d)))
             / (L2 * den);
  return [o1, a1, o2, a2];
}

function stepPhysics(dt) {
  const s = [th1, w1, th2, w2];
  const k1 = derivs(s);
  const k2 = derivs(s.map((v, i) => v + k1[i] * dt / 2));
  const k3 = derivs(s.map((v, i) => v + k2[i] * dt / 2));
  const k4 = derivs(s.map((v, i) => v + k3[i] * dt));
  th1 += dt / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
  w1  += dt / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
  th2 += dt / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
  w2  += dt / 6 * (k1[3] + 2 * k2[3] + 2 * k3[3] + k4[3]);
}

// 系统总能量（用于数值发散监控）
function energy() {
  const L1 = L1_PX / PX_PER_M, L2 = L2_PX / PX_PER_M;
  const v1sq = L1 * L1 * w1 * w1;
  const v2sq = v1sq + L2 * L2 * w2 * w2 + 2 * L1 * L2 * w1 * w2 * Math.cos(th1 - th2);
  const y1 = -L1 * Math.cos(th1);
  const y2 = y1 - L2 * Math.cos(th2);
  return 0.5 * M1 * v1sq + 0.5 * M2 * v2sq + M1 * G * y1 + M2 * G * y2;
}

function positions() {
  const x1 = pivotX + L1_PX * Math.sin(th1);
  const y1 = pivotY + L1_PX * Math.cos(th1);
  return { x1, y1, x2: x1 + L2_PX * Math.sin(th2), y2: y1 + L2_PX * Math.cos(th2) };
}

function drawBob(x, y, hue) {
  ctx.save();
  ctx.shadowColor = `hsla(${hue}, 90%, 65%, 0.8)`;
  ctx.shadowBlur = 26;
  const grad = ctx.createRadialGradient(x - BOB_R / 3, y - BOB_R / 3, 2, x, y, BOB_R);
  grad.addColorStop(0, `hsl(${hue}, 90%, 80%)`);
  grad.addColorStop(1, `hsl(${hue}, 80%, 45%)`);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, BOB_R, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function draw() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#1a1a24';
  ctx.fillRect(0, 0, w, h);

  const { x1, y1, x2, y2 } = positions();

  // 彩虹拖尾：半透明、透明度与线宽沿尾部衰减
  for (let i = 1; i < trail.length; i++) {
    const a = i / trail.length;
    ctx.strokeStyle = `hsla(${trail[i].hue}, 90%, 60%, ${a * 0.55})`;
    ctx.lineWidth = 1 + a * 4;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }

  // 支架与摆杆
  ctx.fillStyle = '#3a3f55';
  ctx.fillRect(pivotX - 60, pivotY - 10, 120, 6);
  ctx.strokeStyle = '#8a93b2';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.fillStyle = '#c6cde8';
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 5, 0, Math.PI * 2);
  ctx.fill();

  drawBob(x1, y1, 215);
  drawBob(x2, y2, hueCursor);

  // HUD
  ctx.fillStyle = 'rgba(198, 205, 232, 0.75)';
  ctx.font = '13px monospace';
  const deg = a => (((a * 180 / Math.PI) % 360 + 540) % 360 - 180).toFixed(1);
  ctx.fillText(`L1 = ${L1_PX} px   L2 = ${L2_PX} px   g = ${G.toFixed(1)} m/s²   m1 = m2 = 1 kg`, 16, 24);
  ctx.fillText(`θ1 = ${deg(th1).padStart(7)}°   θ2 = ${deg(th2).padStart(7)}°`, 16, 44);
  ctx.fillText(`E = ${energy().toFixed(4)} J   ${dragging ? '(拖拽中)' : ''}`, 16, 64);
}

let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.033) dt = 0.033;
  if (!dragging) {
    const sub = 8;
    for (let i = 0; i < sub; i++) stepPhysics(dt / sub);
  }
  const { x2, y2 } = positions();
  hueCursor = (hueCursor + 4) % 360;
  trail.push({ x: x2, y: y2, hue: hueCursor });
  if (trail.length > TRAIL_MAX) trail.shift();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ===== 鼠标拖拽 =====
function pointerPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('pointerdown', e => {
  const p = pointerPos(e);
  const { x1, y1, x2, y2 } = positions();
  const hit = (bx, by) => Math.hypot(p.x - bx, p.y - by) <= BOB_R + 10;
  if (hit(x2, y2)) dragging = 2;
  else if (hit(x1, y1)) dragging = 1;
  if (dragging) {
    canvas.classList.add('dragging');
    canvas.setPointerCapture(e.pointerId);
    trail.length = 0;
    w1 = 0; w2 = 0;
  }
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = pointerPos(e);
  if (dragging === 1) {
    th1 = Math.atan2(p.x - pivotX, p.y - pivotY);
  } else {
    const { x1, y1 } = positions();
    th2 = Math.atan2(p.x - x1, p.y - y1);
  }
  w1 = 0; w2 = 0;
});
function endDrag(e) {
  if (!dragging) return;
  dragging = 0;                       // 松手释放：初速度为零
  canvas.classList.remove('dragging');
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ===== 控制面板 =====
const l1Slider = document.getElementById('l1Slider');
const l2Slider = document.getElementById('l2Slider');
const gSlider = document.getElementById('gSlider');
const l1Val = document.getElementById('l1Val');
const l2Val = document.getElementById('l2Val');
const gVal = document.getElementById('gVal');

l1Slider.addEventListener('input', () => {
  L1_PX = +l1Slider.value;
  l1Val.textContent = L1_PX + ' px';
});
l2Slider.addEventListener('input', () => {
  L2_PX = +l2Slider.value;
  l2Val.textContent = L2_PX + ' px';
});
gSlider.addEventListener('input', () => {
  G = +gSlider.value;
  gVal.textContent = G.toFixed(1);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  th1 = INIT_T1; w1 = 0;
  th2 = INIT_T2; w2 = 0;
  trail.length = 0;
});
</script>
</body>
</html>
